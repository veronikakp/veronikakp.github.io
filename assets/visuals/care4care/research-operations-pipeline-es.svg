<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" lang="es" role="img" aria-labelledby="title description" data-evidence-kind="reconstructed-process"><title id="title">Operaciones de investigación multilingüe</title><desc id="description">Proceso reconstruido · No se muestran datos de participantes. Preparar versiones lingüísticas → Revisión lingüística humana → Implementar las encuestas → Reclutamiento y consentimiento → Semana 1 · General Survey → Semanas 2–5 · Cuestionarios semanales. Reconstrucción editorial del proceso. No es un registro operativo ni atribuye una retrotraducción o validación psicométrica personal.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1120" rx="6" fill="#FFFFFF"/><text x="40" y="40" font-size="14" fill="#5D6B70" font-weight="600">CARE4CARE</text><text x="40" y="82" font-size="27" fill="#173845" font-weight="600">Operaciones de investigación multilingüe</text><text x="40" y="119" font-size="16" fill="#173845" font-weight="600">Proceso reconstruido · No se muestran datos de participantes</text><line x1="40" y1="143" x2="920" y2="143" stroke="#D8E1E1"/><rect x="40" y="171" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="210" font-size="20" fill="#28746F" font-weight="600">01</text><text x="114" y="209" font-size="21" fill="#173845" font-weight="600">Preparar versiones lingüísticas</text><text x="114" y="240" font-size="17" fill="#15262D" font-weight="400">Los primeros borradores asistidos por IA apoyan la preparación de</text><text x="114" y="263" font-size="17" fill="#15262D" font-weight="400">cuestionarios multilingües.</text><path d="M480 278 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="294" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="333" font-size="20" fill="#28746F" font-weight="600">02</text><text x="114" y="332" font-size="21" fill="#173845" font-weight="600">Revisión lingüística humana</text><text x="114" y="363" font-size="17" fill="#15262D" font-weight="400">Hablantes nativos revisan la redacción; la equivalencia y la consistencia</text><text x="114" y="386" font-size="17" fill="#15262D" font-weight="400">requieren revisión humana.</text><path d="M480 401 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="417" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="456" font-size="20" fill="#28746F" font-weight="600">03</text><text x="114" y="455" font-size="21" fill="#173845" font-weight="600">Implementar las encuestas</text><text x="114" y="486" font-size="17" fill="#15262D" font-weight="400">Preparar e implementar la General Survey y los cuestionarios semanales en</text><text x="114" y="509" font-size="17" fill="#15262D" font-weight="400">Qualtrics.</text><path d="M480 524 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="540" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="579" font-size="20" fill="#28746F" font-weight="600">04</text><text x="114" y="578" font-size="21" fill="#173845" font-weight="600">Reclutamiento y consentimiento</text><text x="114" y="609" font-size="17" fill="#15262D" font-weight="400">El personal de cuidados participa voluntariamente tras el consentimiento</text><text x="114" y="632" font-size="17" fill="#15262D" font-weight="400">informado.</text><path d="M480 647 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="663" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="702" font-size="20" fill="#28746F" font-weight="600">05</text><text x="114" y="701" font-size="21" fill="#173845" font-weight="600">Semana 1 · General Survey</text><text x="114" y="732" font-size="17" fill="#15262D" font-weight="400">Tres partes: variables de control, factores de riesgo y protección, e</text><text x="114" y="755" font-size="17" fill="#15262D" font-weight="400">indicadores de bienestar.</text><path d="M480 770 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="786" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="825" font-size="20" fill="#28746F" font-weight="600">06</text><text x="114" y="824" font-size="21" fill="#173845" font-weight="600">Semanas 2–5 · Cuestionarios semanales</text><text x="114" y="855" font-size="17" fill="#15262D" font-weight="400">Cuatro cuestionarios semanales, recordatorios y revisión de completitud</text><text x="114" y="878" font-size="17" fill="#15262D" font-weight="400">sostienen el seguimiento.</text><text x="40" y="939" font-size="15" fill="#5D6B70" font-weight="400">Reconstrucción editorial del proceso. No es un registro operativo ni atribuye una retrotraducción</text><text x="40" y="961" font-size="15" fill="#5D6B70" font-weight="400">o validación psicométrica personal.</text><line x1="40" y1="1008" x2="920" y2="1008" stroke="#D8E1E1"/><text x="40" y="1035" font-size="14" fill="#5D6B70" font-weight="400">Fuente: Elaboración propia a partir de la metodología pública de Care4Care y del trabajo realizado en el proyecto.</text></g></svg>
