<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1050" viewBox="0 0 960 1050" lang="es" role="img" aria-labelledby="title description" data-evidence-kind="reconstructed-process"><title id="title">Armonización · Dos estructuras de análisis</title><desc id="description">Proceso reconstruido · No se muestran datos de participantes. Versiones por país e idioma → Equivalencia de respuestas y códigos → Revisión de estructura y consistencia → Consolidar formatos de análisis comunes. Dos salidas: general/transversal y longitudinal/medidas repetidas. Criterio de inclusión longitudinal publicado: al menos tres cuestionarios semanales consecutivos. No se muestran códigos de respuesta, registros ni identificadores reales.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1050" rx="6" fill="#FFFFFF"/><text x="40" y="40" font-size="14" fill="#5D6B70" font-weight="600">CARE4CARE</text><text x="40" y="82" font-size="27" fill="#173845" font-weight="600">Armonización · Dos estructuras de análisis</text><text x="40" y="119" font-size="16" fill="#173845" font-weight="600">Proceso reconstruido · No se muestran datos de participantes</text><line x1="40" y1="143" x2="920" y2="143" stroke="#D8E1E1"/><rect x="40" y="171" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="210" font-size="20" fill="#28746F" font-weight="600">01</text><text x="114" y="209" font-size="21" fill="#173845" font-weight="600">Versiones por país e idioma</text><text x="114" y="240" font-size="17" fill="#15262D" font-weight="400">Reunir las estructuras de encuesta multilingües para su revisión.</text><path d="M480 271 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="287" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="326" font-size="20" fill="#28746F" font-weight="600">02</text><text x="114" y="325" font-size="21" fill="#173845" font-weight="600">Equivalencia de respuestas y códigos</text><text x="114" y="356" font-size="17" fill="#15262D" font-weight="400">Comprobar que respuestas equivalentes correspondan a códigos numéricos</text><text x="114" y="379" font-size="17" fill="#15262D" font-weight="400">equivalentes.</text><path d="M480 387 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="403" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="442" font-size="20" fill="#28746F" font-weight="600">03</text><text x="114" y="441" font-size="21" fill="#173845" font-weight="600">Revisión de estructura y consistencia</text><text x="114" y="472" font-size="17" fill="#15262D" font-weight="400">Revisar las estructuras por país y resolver inconsistencias antes de</text><text x="114" y="495" font-size="17" fill="#15262D" font-weight="400">consolidar.</text><path d="M480 503 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="519" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="558" font-size="20" fill="#28746F" font-weight="600">04</text><text x="114" y="557" font-size="21" fill="#173845" font-weight="600">Consolidar formatos de análisis comunes</text><text x="114" y="588" font-size="17" fill="#15262D" font-weight="400">Mantener estructuras separadas para el análisis transversal y de medidas</text><text x="114" y="611" font-size="17" fill="#15262D" font-weight="400">repetidas.</text><rect x="40" y="666" width="430" height="144" rx="6" fill="#E9F1F3"/><text x="60" y="698" font-size="20" fill="#173845" font-weight="600">General / transversal</text><text x="60" y="761" font-size="16" fill="#15262D" font-weight="400">Estructura General Survey para el</text><text x="60" y="783" font-size="16" fill="#15262D" font-weight="400">análisis transversal.</text><rect x="490" y="666" width="430" height="144" rx="6" fill="#E9F1F3"/><text x="510" y="698" font-size="20" fill="#173845" font-weight="600">Longitudinal / medidas</text><text x="510" y="726" font-size="20" fill="#173845" font-weight="600">repetidas</text><text x="510" y="761" font-size="16" fill="#15262D" font-weight="400">Estructura de cuestionarios semanales</text><text x="510" y="783" font-size="16" fill="#15262D" font-weight="400">para medidas repetidas.</text><path d="M480 619 V645 M255 645 H705 M255 645 V662 M705 645 V662" fill="none" stroke="#28746F" stroke-width="2"/><text x="40" y="851" font-size="16" fill="#5D6B70" font-weight="400">Criterio de inclusión longitudinal publicado: al menos tres cuestionarios semanales</text><text x="40" y="874" font-size="16" fill="#5D6B70" font-weight="400">consecutivos. No se muestran códigos de respuesta, registros ni identificadores reales.</text><line x1="40" y1="938" x2="920" y2="938" stroke="#D8E1E1"/><text x="40" y="965" font-size="14" fill="#5D6B70" font-weight="400">Fuente: Elaboración propia a partir de la metodología pública de Care4Care y del trabajo de armonización del proyecto.</text></g></svg>
