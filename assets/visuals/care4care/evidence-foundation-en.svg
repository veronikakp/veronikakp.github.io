<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" lang="en" role="img" aria-labelledby="title description" data-evidence-kind="public-data"><title id="title">Evidence foundation · Systematic review</title><desc id="description">Systematic review of paid home care workers: 79 studies, comprising 32 quantitative, 31 qualitative and 16 mixed-methods studies. JBI/PRISMA framework, MMAT quality appraisal and convergent integrated synthesis. These are studies, not participants in the multinational survey.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="650" rx="6" fill="#FFFFFF"/><text x="40" y="40" font-size="14" fill="#5D6B70" font-weight="600">CARE4CARE</text><text x="40" y="82" font-size="27" fill="#173845" font-weight="600">Evidence foundation · Systematic review</text><text x="40" y="119" font-size="16" fill="#173845" font-weight="600">Public aggregate evidence</text><line x1="40" y1="143" x2="920" y2="143" stroke="#D8E1E1"/><text x="40" y="225" font-size="52" fill="#173845" font-weight="600">79</text><text x="157" y="191" font-size="22" fill="#173845" font-weight="600">Studies in the final published review</text><rect x="40" y="265" width="280" height="148" rx="6" fill="#F0F4F3"/><text x="58" y="320" font-size="34" fill="#173845" font-weight="600" data-design="quantitative" data-study-count="32">32</text><text x="58" y="358" font-size="18" fill="#15262D" font-weight="400">Quantitative studies</text><rect x="340" y="265" width="280" height="148" rx="6" fill="#F0F4F3"/><text x="358" y="320" font-size="34" fill="#173845" font-weight="600" data-design="qualitative" data-study-count="31">31</text><text x="358" y="358" font-size="18" fill="#15262D" font-weight="400">Qualitative studies</text><rect x="640" y="265" width="280" height="148" rx="6" fill="#F0F4F3"/><text x="658" y="320" font-size="34" fill="#173845" font-weight="600" data-design="mixed-methods" data-study-count="16">16</text><text x="658" y="358" font-size="18" fill="#15262D" font-weight="400">Mixed-methods studies</text><text x="40" y="461" font-size="16" fill="#5D6B70" font-weight="400">Paid home care workers · 79 studies, not study participants. JBI / PRISMA · MMAT appraisal ·</text><text x="40" y="485" font-size="16" fill="#5D6B70" font-weight="400">Convergent integrated synthesis.</text><line x1="40" y1="538" x2="920" y2="538" stroke="#D8E1E1"/><text x="40" y="565" font-size="14" fill="#5D6B70" font-weight="400">Source: Kuradchik-Pekarskaya et al. (2026), The Gerontologist, 66(8), gnag131, study characteristics</text><text x="40" y="586" font-size="14" fill="#5D6B70" font-weight="400">and methods. CC BY 4.0. Original editorial adaptation.</text></g></svg>
