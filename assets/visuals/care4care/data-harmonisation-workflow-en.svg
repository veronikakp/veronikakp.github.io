<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1050" viewBox="0 0 960 1050" lang="en" role="img" aria-labelledby="title description" data-evidence-kind="reconstructed-process"><title id="title">Data harmonisation · Two analytical structures</title><desc id="description">Reconstructed process · No participant data shown. Country &amp; language versions → Response &amp; code equivalence → Structure &amp; consistency checks → Consolidate common analytical formats. Two outputs: general/cross-sectional and longitudinal/repeated measures. Published longitudinal inclusion criterion: at least three consecutive weekly questionnaires. No real response codes, records or identifiers are displayed.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1050" rx="6" fill="#FFFFFF"/><text x="40" y="40" font-size="14" fill="#5D6B70" font-weight="600">CARE4CARE</text><text x="40" y="82" font-size="27" fill="#173845" font-weight="600">Data harmonisation · Two analytical structures</text><text x="40" y="119" font-size="16" fill="#173845" font-weight="600">Reconstructed process · No participant data shown</text><line x1="40" y1="143" x2="920" y2="143" stroke="#D8E1E1"/><rect x="40" y="171" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="210" font-size="20" fill="#28746F" font-weight="600">01</text><text x="114" y="209" font-size="21" fill="#173845" font-weight="600">Country &amp; language versions</text><text x="114" y="240" font-size="17" fill="#15262D" font-weight="400">Bring the multilingual survey structures together for review.</text><path d="M480 271 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="287" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="326" font-size="20" fill="#28746F" font-weight="600">02</text><text x="114" y="325" font-size="21" fill="#173845" font-weight="600">Response &amp; code equivalence</text><text x="114" y="356" font-size="17" fill="#15262D" font-weight="400">Check that equivalent responses correspond to equivalent numeric codes.</text><path d="M480 387 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="403" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="442" font-size="20" fill="#28746F" font-weight="600">03</text><text x="114" y="441" font-size="21" fill="#173845" font-weight="600">Structure &amp; consistency checks</text><text x="114" y="472" font-size="17" fill="#15262D" font-weight="400">Review country structures and resolve inconsistencies before consolidation.</text><path d="M480 503 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="519" width="880" height="100" rx="6" fill="#F0F4F3"/><text x="60" y="558" font-size="20" fill="#28746F" font-weight="600">04</text><text x="114" y="557" font-size="21" fill="#173845" font-weight="600">Consolidate common analytical formats</text><text x="114" y="588" font-size="17" fill="#15262D" font-weight="400">Maintain separate structures for cross-sectional and repeated-measures</text><text x="114" y="611" font-size="17" fill="#15262D" font-weight="400">analysis.</text><rect x="40" y="666" width="430" height="144" rx="6" fill="#E9F1F3"/><text x="60" y="698" font-size="20" fill="#173845" font-weight="600">General / cross-sectional</text><text x="60" y="761" font-size="16" fill="#15262D" font-weight="400">General Survey structure for cross-</text><text x="60" y="783" font-size="16" fill="#15262D" font-weight="400">sectional analysis.</text><rect x="490" y="666" width="430" height="144" rx="6" fill="#E9F1F3"/><text x="510" y="698" font-size="20" fill="#173845" font-weight="600">Longitudinal / repeated</text><text x="510" y="726" font-size="20" fill="#173845" font-weight="600">measures</text><text x="510" y="761" font-size="16" fill="#15262D" font-weight="400">Weekly questionnaire structure for</text><text x="510" y="783" font-size="16" fill="#15262D" font-weight="400">repeated-measures analysis.</text><path d="M480 619 V645 M255 645 H705 M255 645 V662 M705 645 V662" fill="none" stroke="#28746F" stroke-width="2"/><text x="40" y="851" font-size="16" fill="#5D6B70" font-weight="400">Published longitudinal inclusion criterion: at least three consecutive weekly questionnaires. No</text><text x="40" y="874" font-size="16" fill="#5D6B70" font-weight="400">real response codes, records or identifiers are displayed.</text><line x1="40" y1="938" x2="920" y2="938" stroke="#D8E1E1"/><text x="40" y="965" font-size="14" fill="#5D6B70" font-weight="400">Source: Own elaboration based on Care4Care’s public methodology and the data-harmonisation work in the project.</text></g></svg>
