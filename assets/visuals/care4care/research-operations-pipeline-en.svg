<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" lang="en" role="img" aria-labelledby="title description" data-evidence-kind="reconstructed-process"><title id="title">Multilingual research operations</title><desc id="description">Reconstructed process · No participant data shown. Prepare language versions → Human language QA → Implement the surveys → Recruitment &amp; consent → Week 1 · General Survey → Weeks 2–5 · Weekly questionnaires. Editorial reconstruction of the workflow. It is not an operational tracker or a claim of personal back-translation or psychometric validation.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1120" rx="6" fill="#FFFFFF"/><text x="40" y="40" font-size="14" fill="#5D6B70" font-weight="600">CARE4CARE</text><text x="40" y="82" font-size="27" fill="#173845" font-weight="600">Multilingual research operations</text><text x="40" y="119" font-size="16" fill="#173845" font-weight="600">Reconstructed process · No participant data shown</text><line x1="40" y1="143" x2="920" y2="143" stroke="#D8E1E1"/><rect x="40" y="171" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="210" font-size="20" fill="#28746F" font-weight="600">01</text><text x="114" y="209" font-size="21" fill="#173845" font-weight="600">Prepare language versions</text><text x="114" y="240" font-size="17" fill="#15262D" font-weight="400">AI-assisted first drafts support preparation of the multilingual</text><text x="114" y="263" font-size="17" fill="#15262D" font-weight="400">questionnaires.</text><path d="M480 278 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="294" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="333" font-size="20" fill="#28746F" font-weight="600">02</text><text x="114" y="332" font-size="21" fill="#173845" font-weight="600">Human language QA</text><text x="114" y="363" font-size="17" fill="#15262D" font-weight="400">Native speakers review wording; response equivalence and consistency require</text><text x="114" y="386" font-size="17" fill="#15262D" font-weight="400">human checks.</text><path d="M480 401 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="417" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="456" font-size="20" fill="#28746F" font-weight="600">03</text><text x="114" y="455" font-size="21" fill="#173845" font-weight="600">Implement the surveys</text><text x="114" y="486" font-size="17" fill="#15262D" font-weight="400">Prepare and implement the General Survey and weekly questionnaires in</text><text x="114" y="509" font-size="17" fill="#15262D" font-weight="400">Qualtrics.</text><path d="M480 524 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="540" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="579" font-size="20" fill="#28746F" font-weight="600">04</text><text x="114" y="578" font-size="21" fill="#173845" font-weight="600">Recruitment &amp; consent</text><text x="114" y="609" font-size="17" fill="#15262D" font-weight="400">Care workers enter the study voluntarily after informed consent.</text><path d="M480 647 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="663" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="702" font-size="20" fill="#28746F" font-weight="600">05</text><text x="114" y="701" font-size="21" fill="#173845" font-weight="600">Week 1 · General Survey</text><text x="114" y="732" font-size="17" fill="#15262D" font-weight="400">Three parts: control variables, risk and protective factors, and well-being</text><text x="114" y="755" font-size="17" fill="#15262D" font-weight="400">outcomes.</text><path d="M480 770 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="786" width="880" height="107" rx="6" fill="#F0F4F3"/><text x="60" y="825" font-size="20" fill="#28746F" font-weight="600">06</text><text x="114" y="824" font-size="21" fill="#173845" font-weight="600">Weeks 2–5 · Weekly questionnaires</text><text x="114" y="855" font-size="17" fill="#15262D" font-weight="400">Four weekly questionnaires, reminders and completion checks sustain the</text><text x="114" y="878" font-size="17" fill="#15262D" font-weight="400">repeated component.</text><text x="40" y="939" font-size="15" fill="#5D6B70" font-weight="400">Editorial reconstruction of the workflow. It is not an operational tracker or a claim of personal</text><text x="40" y="961" font-size="15" fill="#5D6B70" font-weight="400">back-translation or psychometric validation.</text><line x1="40" y1="1008" x2="920" y2="1008" stroke="#D8E1E1"/><text x="40" y="1035" font-size="14" fill="#5D6B70" font-weight="400">Source: Care4Care D4.2, §§1.1–1.5, PDF pp. 12–15; language QA contribution described in this case</text><text x="40" y="1056" font-size="14" fill="#5D6B70" font-weight="400">study. Original process reconstruction.</text></g></svg>
