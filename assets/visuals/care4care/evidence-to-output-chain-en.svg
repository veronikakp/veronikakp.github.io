<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1110" viewBox="0 0 960 1110" lang="en" role="img" aria-labelledby="title description" data-evidence-kind="reconstructed-process"><title id="title">From evidence to professional communication</title><desc id="description">Reconstructed process · No participant data shown. Data → Findings → Interpretation → Recommendations → Professional communication. Contribution boundary: primary technical responsibility for quantitative preparation, analysis and interpretation; another technician led qualitative analysis. No presentation screenshot, date, audience count or impact is invented.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1110" rx="6" fill="#FFFFFF"/><text x="40" y="40" font-size="14" fill="#5D6B70" font-weight="600">CARE4CARE</text><text x="40" y="82" font-size="27" fill="#173845" font-weight="600">From evidence to professional communication</text><text x="40" y="119" font-size="16" fill="#173845" font-weight="600">Reconstructed process · No participant data shown</text><line x1="40" y1="143" x2="920" y2="143" stroke="#D8E1E1"/><rect x="40" y="171" width="880" height="122" rx="6" fill="#F0F4F3"/><text x="60" y="210" font-size="20" fill="#28746F" font-weight="600">01</text><text x="114" y="209" font-size="21" fill="#173845" font-weight="600">Data</text><text x="114" y="240" font-size="17" fill="#15262D" font-weight="400">Prepared survey evidence and complementary qualitative findings.</text><path d="M480 293 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="309" width="880" height="122" rx="6" fill="#F0F4F3"/><text x="60" y="348" font-size="20" fill="#28746F" font-weight="600">02</text><text x="114" y="347" font-size="21" fill="#173845" font-weight="600">Findings</text><text x="114" y="378" font-size="17" fill="#15262D" font-weight="400">Quantitative workforce insights and the distinct qualitative analysis</text><text x="114" y="401" font-size="17" fill="#15262D" font-weight="400">stream.</text><path d="M480 431 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="447" width="880" height="122" rx="6" fill="#F0F4F3"/><text x="60" y="486" font-size="20" fill="#28746F" font-weight="600">03</text><text x="114" y="485" font-size="21" fill="#173845" font-weight="600">Interpretation</text><text x="114" y="516" font-size="17" fill="#15262D" font-weight="400">Bring the evidence streams together under scientific supervision.</text><path d="M480 569 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="585" width="880" height="122" rx="6" fill="#F0F4F3"/><text x="60" y="624" font-size="20" fill="#28746F" font-weight="600">04</text><text x="114" y="623" font-size="21" fill="#173845" font-weight="600">Recommendations</text><text x="114" y="654" font-size="17" fill="#15262D" font-weight="400">Translate the findings into accessible recommendations for professional and</text><text x="114" y="677" font-size="17" fill="#15262D" font-weight="400">policy audiences.</text><path d="M480 707 v13 m-4 -4 l4 4 l4 -4" fill="none" stroke="#28746F" stroke-width="1.8"/><rect x="40" y="723" width="880" height="122" rx="6" fill="#F0F4F3"/><text x="60" y="762" font-size="20" fill="#28746F" font-weight="600">05</text><text x="114" y="761" font-size="21" fill="#173845" font-weight="600">Professional communication</text><text x="114" y="792" font-size="17" fill="#15262D" font-weight="400">Public reports and communication to care-sector stakeholders.</text><text x="40" y="901" font-size="16" fill="#5D6B70" font-weight="400">Contribution boundary: primary technical responsibility for quantitative preparation, analysis</text><text x="40" y="925" font-size="16" fill="#5D6B70" font-weight="400">and interpretation; another technician led qualitative analysis.</text><line x1="40" y1="998" x2="920" y2="998" stroke="#D8E1E1"/><text x="40" y="1025" font-size="14" fill="#5D6B70" font-weight="400">Source: Own elaboration based on Care4Care’s public reports and publications and the work carried out in the project.</text></g></svg>
