<svg xmlns="http://www.w3.org/2000/svg" width="960" height="825" viewBox="0 0 960 825" lang="en" role="img" aria-labelledby="title description" data-evidence-kind="public-data"><title id="title">Selected aggregate indicators · N=696</title><desc id="description">Selected aggregate indicators, N=696: Burnout 2.71/4 (scale 1–4); turnover intention 2.23/5 (1–5); work–private-life conflict 2.64/5 (1–5); flourishing 5.53/7 (1–7). Separate numeric cards, without a common comparison axis or thresholds.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="825" rx="6" fill="#FFFFFF"/><text x="40" y="40" font-size="14" fill="#5D6B70" font-weight="600">CARE4CARE</text><text x="40" y="82" font-size="27" fill="#173845" font-weight="600">Selected aggregate indicators · N=696</text><text x="40" y="119" font-size="16" fill="#173845" font-weight="600">Public aggregate evidence</text><line x1="40" y1="143" x2="920" y2="143" stroke="#D8E1E1"/><rect x="40" y="172" width="430" height="214" rx="6" fill="#F0F4F3"/><text x="62" y="210" font-size="20" fill="#173845" font-weight="600">Burnout</text><text x="62" y="308" font-size="48" fill="#173845" font-weight="600" data-indicator="burnout" data-mean="2.71" data-scale="1–4">2.71</text><text x="204" y="307" font-size="24" fill="#5D6B70" font-weight="400">/ 4</text><text x="62" y="355" font-size="17" fill="#5D6B70" font-weight="400">Scale 1–4</text><rect x="490" y="172" width="430" height="214" rx="6" fill="#F0F4F3"/><text x="512" y="210" font-size="20" fill="#173845" font-weight="600">Turnover intention</text><text x="512" y="308" font-size="48" fill="#173845" font-weight="600" data-indicator="turnover-intention" data-mean="2.23" data-scale="1–5">2.23</text><text x="654" y="307" font-size="24" fill="#5D6B70" font-weight="400">/ 5</text><text x="512" y="355" font-size="17" fill="#5D6B70" font-weight="400">Scale 1–5</text><rect x="40" y="408" width="430" height="214" rx="6" fill="#F0F4F3"/><text x="62" y="446" font-size="20" fill="#173845" font-weight="600">Work–private-life conflict</text><text x="62" y="544" font-size="48" fill="#173845" font-weight="600" data-indicator="work-private-life-conflict" data-mean="2.64" data-scale="1–5">2.64</text><text x="204" y="543" font-size="24" fill="#5D6B70" font-weight="400">/ 5</text><text x="62" y="591" font-size="17" fill="#5D6B70" font-weight="400">Scale 1–5</text><rect x="490" y="408" width="430" height="214" rx="6" fill="#F0F4F3"/><text x="512" y="446" font-size="20" fill="#173845" font-weight="600">Flourishing</text><text x="512" y="544" font-size="48" fill="#173845" font-weight="600" data-indicator="flourishing" data-mean="5.53" data-scale="1–7">5.53</text><text x="654" y="543" font-size="24" fill="#5D6B70" font-weight="400">/ 7</text><text x="512" y="591" font-size="17" fill="#5D6B70" font-weight="400">Scale 1–7</text><text x="40" y="667" font-size="16" fill="#5D6B70" font-weight="400">Published means, each on its own scale. These are not prevalence percentages or directly</text><text x="40" y="689" font-size="16" fill="#5D6B70" font-weight="400">comparable magnitudes. No thresholds are applied.</text><line x1="40" y1="713" x2="920" y2="713" stroke="#D8E1E1"/><text x="40" y="740" font-size="14" fill="#5D6B70" font-weight="400">Source: Care4Care D4.2, table 8, PDF p. 43; scale definitions, PDF pp. 45–50. Original editorial</text><text x="40" y="761" font-size="14" fill="#5D6B70" font-weight="400">presentation of published aggregates.</text></g></svg>
