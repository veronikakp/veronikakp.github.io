<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" lang="es" role="img" aria-labelledby="title description"><title id="title">Evidencia del diagnóstico</title><desc id="description">Las correlaciones de Pearson con rotación no deseada son pequeñas. Engagement r=−0,165 y carga manejable r=−0,163 tienen p&lt;,001. Plazos −0,114, formación −0,112, desempeño +0,106, carrera −0,106 y equidad −0,104 tienen p&lt;,05. La asociación no demuestra causalidad.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="850" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Evidencia del diagnóstico</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Proyecto académico en equipo · Datos de RR. HH. simulados</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="180" font-size="20" fill="#173845" font-weight="600">r de Pearson · rotación no deseada</text><text x="352" y="222" font-size="16" fill="#15262D" font-weight="400">−1</text><line x1="360" y1="236" x2="360" y2="637" stroke="#D8E1E1"/><text x="572" y="222" font-size="16" fill="#15262D" font-weight="400">0</text><line x1="580" y1="236" x2="580" y2="637" stroke="#D8E1E1"/><text x="792" y="222" font-size="16" fill="#15262D" font-weight="400">+1</text><line x1="800" y1="236" x2="800" y2="637" stroke="#D8E1E1"/><text x="40" y="270" font-size="18" fill="#15262D" font-weight="400">Engagement</text><rect x="543.7" y="255" width="36.300000000000004" height="14" rx="0" fill="#2B6F83"/><text x="830" y="270" font-size="18" fill="#15262D" font-weight="400">−0,165</text><text x="830" y="290" font-size="13" fill="#5D6B70" font-weight="400">p &lt; ,001</text><text x="40" y="323" font-size="18" fill="#15262D" font-weight="400">Carga manejable</text><rect x="544.14" y="308" width="35.86" height="14" rx="0" fill="#2B6F83"/><text x="830" y="323" font-size="18" fill="#15262D" font-weight="400">−0,163</text><text x="830" y="343" font-size="13" fill="#5D6B70" font-weight="400">p &lt; ,001</text><text x="40" y="376" font-size="18" fill="#15262D" font-weight="400">Plazos razonables</text><rect x="554.92" y="361" width="25.080000000000002" height="14" rx="0" fill="#2B6F83"/><text x="830" y="376" font-size="18" fill="#15262D" font-weight="400">−0,114</text><text x="830" y="396" font-size="13" fill="#5D6B70" font-weight="400">p &lt; ,05</text><text x="40" y="429" font-size="18" fill="#15262D" font-weight="400">Horas anuales de formación</text><rect x="555.36" y="414" width="24.64" height="14" rx="0" fill="#2B6F83"/><text x="830" y="429" font-size="18" fill="#15262D" font-weight="400">−0,112</text><text x="830" y="449" font-size="13" fill="#5D6B70" font-weight="400">p &lt; ,05</text><text x="40" y="482" font-size="18" fill="#15262D" font-weight="400">Desempeño</text><rect x="580" y="467" width="23.32" height="14" rx="0" fill="#2B6F83"/><text x="830" y="482" font-size="18" fill="#15262D" font-weight="400">+0,106</text><text x="830" y="502" font-size="13" fill="#5D6B70" font-weight="400">p &lt; ,05</text><text x="40" y="535" font-size="18" fill="#15262D" font-weight="400">Trayectoria profesional</text><rect x="556.68" y="520" width="23.32" height="14" rx="0" fill="#2B6F83"/><text x="830" y="535" font-size="18" fill="#15262D" font-weight="400">−0,106</text><text x="830" y="555" font-size="13" fill="#5D6B70" font-weight="400">p &lt; ,05</text><text x="40" y="588" font-size="18" fill="#15262D" font-weight="400">Equidad salarial</text><rect x="557.12" y="573" width="22.88" height="14" rx="0" fill="#2B6F83"/><text x="830" y="588" font-size="18" fill="#15262D" font-weight="400">−0,104</text><text x="830" y="608" font-size="13" fill="#5D6B70" font-weight="400">p &lt; ,05</text><text x="40" y="688" font-size="15" fill="#5D6B70" font-weight="400">La escala completa de −1 a +1 mantiene pequeñas las magnitudes pequeñas. Estas asociaciones</text><text x="40" y="712" font-size="15" fill="#5D6B70" font-weight="400">apoyan el diagnóstico, no afirmaciones causales ni decisiones individuales.</text><line x1="40" y1="762" x2="920" y2="762" stroke="#D8E1E1"/><text x="40" y="791" font-size="13" fill="#5D6B70" font-weight="400">Fuente: informe final NovaData Insights, §4.3, PDF pp. 28–29; clima multidimensional, rotación no</text><text x="40" y="815" font-size="13" fill="#5D6B70" font-weight="400">deseada.</text></g></svg>
