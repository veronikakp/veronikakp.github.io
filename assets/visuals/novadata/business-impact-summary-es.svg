<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" lang="es" role="img" aria-labelledby="title description"><title id="title">Coste de rotación · estimación de escenario</title><desc id="description">Coste simulado de escenario para 2017–2024: total 2,58 millones de euros, salidas no deseadas 2,30 millones y evitables 2,08 millones. Las no deseadas representan el 89,2% del coste total estimado. Componentes: selección, vacante, pérdida de productividad en ramp-up e incorporación. Las categorías se solapan y no deben sumarse. No son costes contables observados.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="690" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Coste de rotación · estimación de escenario</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Proyecto académico en equipo · Datos de RR. HH. simulados</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="220" font-size="56" fill="#173845" font-weight="600">2,58 M€</text><text x="410" y="199" font-size="20" fill="#15262D" font-weight="400">Coste total estimado de rotación</text><text x="40" y="292" font-size="25" fill="#173845" font-weight="600">2,30 M€ · salidas no deseadas</text><text x="490" y="292" font-size="25" fill="#173845" font-weight="600">2,08 M€ · salidas evitables</text><text x="40" y="342" font-size="16" fill="#5D6B70" font-weight="400">89,2% asociado a salidas no deseadas. Las categorías se solapan; no deben sumarse.</text><rect x="40" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="54" y="445" font-size="18" fill="#15262D" font-weight="400">Selección</text><rect x="265" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="279" y="445" font-size="18" fill="#15262D" font-weight="400">Vacante</text><rect x="490" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="504" y="445" font-size="18" fill="#15262D" font-weight="400">Pérdida en ramp-up</text><rect x="715" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="729" y="445" font-size="18" fill="#15262D" font-weight="400">Incorporación</text><text x="40" y="529" font-size="15" fill="#5D6B70" font-weight="400">Estimaciones bajo supuestos documentados, no gasto contable observado, ahorro ni ROI de una</text><text x="40" y="553" font-size="15" fill="#5D6B70" font-weight="400">intervención. El periodo es 2017–2024.</text><line x1="40" y1="602" x2="920" y2="602" stroke="#D8E1E1"/><text x="40" y="631" font-size="13" fill="#5D6B70" font-weight="400">Fuente: Elaboración propia a partir de los datos simulados y los análisis desarrollados en el proyecto académico NovaData Insights.</text></g></svg>
