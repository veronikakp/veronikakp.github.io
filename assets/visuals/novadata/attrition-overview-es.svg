<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" lang="es" role="img" aria-labelledby="title description"><title id="title">Rotación no deseada en 2025</title><desc id="description">Datos simulados de 2025: 162 registros de empleados, 62 salidas totales, 55 no deseadas y 51 clasificadas como evitables. La rotación no deseada es del 34,0%, 4,4 puntos porcentuales más interanualmente. El 88,7% de las salidas son no deseadas.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Rotación no deseada en 2025</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Proyecto académico en equipo · Datos de RR. HH. simulados</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="225" font-size="62" fill="#173845" font-weight="600">34,0%</text><text x="340" y="201" font-size="22" fill="#15262D" font-weight="400">Tasa de rotación no deseada</text><text x="340" y="234" font-size="18" fill="#28746F" font-weight="400">+4,4 pp interanuales</text><rect x="40" y="280" width="280" height="112" rx="6" fill="#F0F4F3"/><text x="60" y="331" font-size="38" fill="#173845" font-weight="600">62</text><text x="60" y="365" font-size="18" fill="#15262D" font-weight="400">Salidas totales</text><rect x="340" y="280" width="280" height="112" rx="6" fill="#F0F4F3"/><text x="360" y="331" font-size="38" fill="#173845" font-weight="600">55</text><text x="360" y="365" font-size="18" fill="#15262D" font-weight="400">Salidas no deseadas</text><rect x="640" y="280" width="280" height="112" rx="6" fill="#F0F4F3"/><text x="660" y="331" font-size="38" fill="#173845" font-weight="600">51</text><text x="660" y="365" font-size="18" fill="#15262D" font-weight="400">Salidas evitables</text><text x="40" y="439" font-size="16" fill="#5D6B70" font-weight="400">88,7% de las salidas fueron no deseadas. Denominador: 162 registros en 2025.</text><text x="40" y="495" font-size="15" fill="#5D6B70" font-weight="400">Categorías de salida separadas; los recuentos no se muestran como subconjuntos anidados. Las</text><text x="40" y="519" font-size="15" fill="#5D6B70" font-weight="400">tasas usan el denominador del dashboard de 2025, no la plantilla media anual.</text><line x1="40" y1="552" x2="920" y2="552" stroke="#D8E1E1"/><text x="40" y="581" font-size="13" fill="#5D6B70" font-weight="400">Fuente: Elaboración propia a partir de los datos simulados y los análisis desarrollados en el proyecto académico NovaData Insights.</text></g></svg>
