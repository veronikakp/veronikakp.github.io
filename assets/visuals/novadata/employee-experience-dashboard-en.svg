<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" lang="en" role="img" aria-labelledby="title description"><title id="title">Employee experience · 2025</title><desc id="description">2025 simulated averages: engagement 2.71 out of 5, climate 2.82 out of 5, 46.62 weekly hours and salary gap −14% versus market. Climate dimensions, on a 1–5 scale: career 2.7, growth 2.63, pay fairness 2.56, manageable workload 2.46 and reasonable deadlines 2.46.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Employee experience · 2025</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Academic team project · Simulated HR data</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><rect x="40" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="56" y="212" font-size="31" fill="#173845" font-weight="600">2.71</text><text x="56" y="242" font-size="16" fill="#15262D" font-weight="400">Engagement</text><text x="200" y="212" font-size="16" fill="#15262D" font-weight="400">/ 5</text><rect x="265" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="281" y="212" font-size="31" fill="#173845" font-weight="600">2.82</text><text x="281" y="242" font-size="16" fill="#15262D" font-weight="400">Climate</text><text x="425" y="212" font-size="16" fill="#15262D" font-weight="400">/ 5</text><rect x="490" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="506" y="212" font-size="31" fill="#173845" font-weight="600">46.62</text><text x="506" y="242" font-size="16" fill="#15262D" font-weight="400">Weekly hours</text><text x="650" y="212" font-size="16" fill="#15262D" font-weight="400"></text><rect x="715" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="731" y="212" font-size="31" fill="#173845" font-weight="600">−14%</text><text x="731" y="242" font-size="16" fill="#15262D" font-weight="400">Salary gap</text><text x="875" y="212" font-size="16" fill="#15262D" font-weight="400"></text><text x="40" y="315" font-size="20" fill="#173845" font-weight="600">Climate dimensions · mean, scale 1–5</text><text x="40" y="358" font-size="18" fill="#15262D" font-weight="400">Career path</text><rect x="330" y="343" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="343" width="259.20000000000005" height="12" rx="0" fill="#2B6F83"/><text x="839" y="358" font-size="18" fill="#15262D" font-weight="400">2.7 / 5</text><text x="40" y="406" font-size="18" fill="#15262D" font-weight="400">Professional growth</text><rect x="330" y="391" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="391" width="252.48000000000002" height="12" rx="0" fill="#2B6F83"/><text x="839" y="406" font-size="18" fill="#15262D" font-weight="400">2.63 / 5</text><text x="40" y="454" font-size="18" fill="#15262D" font-weight="400">Pay fairness</text><rect x="330" y="439" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="439" width="245.76" height="12" rx="0" fill="#2B6F83"/><text x="839" y="454" font-size="18" fill="#15262D" font-weight="400">2.56 / 5</text><text x="40" y="502" font-size="18" fill="#15262D" font-weight="400">Manageable workload</text><rect x="330" y="487" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="487" width="236.16" height="12" rx="0" fill="#2B6F83"/><text x="839" y="502" font-size="18" fill="#15262D" font-weight="400">2.46 / 5</text><text x="40" y="550" font-size="18" fill="#15262D" font-weight="400">Reasonable deadlines</text><rect x="330" y="535" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="535" width="236.16" height="12" rx="0" fill="#2B6F83"/><text x="839" y="550" font-size="18" fill="#15262D" font-weight="400">2.46 / 5</text><text x="40" y="601" font-size="14" fill="#5D6B70" font-weight="400">Bars drawn from zero; instrument scale 1–5.</text><text x="40" y="635" font-size="15" fill="#5D6B70" font-weight="400">The panel retains each measure’s own unit. Climate dimensions are descriptive averages; they do</text><text x="40" y="659" font-size="15" fill="#5D6B70" font-weight="400">not explain the causes of exits.</text><line x1="40" y1="672" x2="920" y2="672" stroke="#D8E1E1"/><text x="40" y="701" font-size="13" fill="#5D6B70" font-weight="400">Source: Own elaboration based on the simulated data and analyses developed for the NovaData Insights academic project.</text></g></svg>
