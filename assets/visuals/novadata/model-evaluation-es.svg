<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" lang="es" role="img" aria-labelledby="title description"><title id="title">Best model ≠ decision-ready model</title><desc id="description">Regresión logística multidimensional seleccionada: ROC AUC 0,634, precisión 0,107, recall 0,500, F1 0,176 y accuracy 0,770. La precisión limita decisiones fiables por empleado. La comparación incluye tres modelos y dos especificaciones de clima; recall y F1 del árbol son N.D., conservando los valores ausentes de la tabla comparativa original.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="900" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Best model ≠ decision-ready model</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Proyecto académico en equipo · Datos de RR. HH. simulados</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="184" font-size="20" fill="#173845" font-weight="600">Seleccionado: regresión logística · dimensiones de clima</text><rect x="40" y="210" width="420" height="106" rx="6" fill="#E5F0EE"/><text x="58" y="258" font-size="40" fill="#173845" font-weight="600">0,634</text><text x="58" y="292" font-size="18" fill="#15262D" font-weight="400">ROC AUC</text><rect x="480" y="210" width="420" height="106" rx="6" fill="#E5F0EE"/><text x="498" y="258" font-size="40" fill="#173845" font-weight="600">0,107</text><text x="498" y="292" font-size="18" fill="#15262D" font-weight="400">Precisión · rotación no deseada</text><text x="40" y="370" font-size="16" fill="#173845" font-weight="600">Modelo / clima</text><text x="480" y="370" font-size="16" fill="#173845" font-weight="600">Accuracy</text><text x="570" y="370" font-size="16" fill="#173845" font-weight="600">Recall</text><text x="660" y="370" font-size="16" 