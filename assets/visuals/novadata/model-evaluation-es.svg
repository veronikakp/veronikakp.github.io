t x="570" y="554" font-size="17" fill="#15262D" font-weight="400">0,500</text><text x="660" y="554" font-size="17" fill="#15262D" font-weight="400">0,107</text><text x="750" y="554" font-size="17" fill="#15262D" font-weight="400">0,176</text><text x="840" y="554" font-size="17" fill="#15262D" font-weight="400">0,634</text><text x="40" y="602" font-size="16" fill="#173845" font-weight="400">Árbol de decisión · dimensiones</text><text x="480" y="602" font-size="17" fill="#15262D" font-weight="400">0,770</text><text x="570" y="602" font-size="17" fill="#15262D" font-weight="400">N.D.</text><text x="660" y="602" font-size="17" fill="#15262D" font-weight="400">0</text><text x="750" y="602" font-size="17" fill="#15262D" font-weight="400">N.D.</text><text x="840" y="602" font-size="17" fill="#15262D" font-weight="400">0,505</text><text x="40" y="650" font-size="16" fill="#173845" font-weight="400">Random forest · dimensiones</text><text x="480" y="650" font-size="17" fill="#15262D" font-weight="400">0,738</text><text x="570" y="650" font-size="17" fill="#15262D" font-weight="400">0,25</text><text x="660" y="650" font-size="17" fill="#15262D" font-weight="400">0,071</text><text x="750" y="650" font-size="17" fill="#15262D" font-weight="400">0,111</text><text x="840" y="650" font-size="17" fill="#15262D" font-weight="400">0,596</text><text x="40" y="729" font-size="15" fill="#5D6B70" font-weight="400">N.D. = valor ausente en la tabla comparativa original; no se ha sustituido por cero.</text><text x="40" y="781" font-size="15" fill="#5D6B70" font-weight="400">Priorización exploratoria, no decisiones individuales fiables.</text><line x1="40" y1="812" x2="920" y2="812" stroke="#D8E1E1"/><text x="40" y="841" font-size="13" fill="#5D6B70" font-weight="400">Fuente: informe final NovaData Insights, §5.4, PDF p. 47; selección del modelo y limitaciones, pp.</text><text x="40" y="865" font-size="13" fill="#5D6B70" font-weight="400">48–49.</text></g></svg>
