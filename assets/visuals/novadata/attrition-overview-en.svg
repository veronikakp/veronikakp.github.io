<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" lang="en" role="img" aria-labelledby="title description"><title id="title">Unwanted attrition in 2025</title><desc id="description">2025 simulated data: 162 employee records, 62 total exits, 55 unwanted exits and 51 classified as avoidable. Unwanted attrition is 34.0%, up 4.4 percentage points year on year. Unwanted exits account for 88.7% of all exits.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Unwanted attrition in 2025</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Academic team project · Simulated HR data</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="225" font-size="62" fill="#173845" font-weight="600">34.0%</text><text x="340" y="201" font-size="22" fill="#15262D" font-weight="400">Unwanted attrition rate</text><text x="340" y="234" font-size="18" fill="#28746F" font-weight="400">+4.4 pp year on year</text><rect x="40" y="280" width="280" height="112" rx="6" fill="#F0F4F3"/><text x="60" y="331" font-size="38" fill="#173845" font-weight="600">62</text><text x="60" y="365" font-size="18" fill="#15262D" font-weight="400">Total exits</text><rect x="340" y="280" width="280" height="112" rx="6" fill="#F0F4F3"/><text x="360" y="331" font-size="38" fill="#173845" font-weight="600">55</text><text x="360" y="365" font-size="18" fill="#15262D" font-weight="400">Unwanted exits</text><rect x="640" y="280" width="280" height="112" rx="6" fill="#F0F4F3"/><text x="660" y="331" font-size="38" fill="#173845" font-weight="600">51</text><text x="660" y="365" font-size="18" fill="#15262D" font-weight="400">Avoidable exits</text><text x="40" y="439" font-size="16" fill="#5D6B70" font-weight="400">88.7% of exits were unwanted. Denominator: 162 employee records in 2025.</text><text x="40" y="495" font-size="15" fill="#5D6B70" font-weight="400">Separate categories of exits; the counts are not shown as nested subsets. Rates use the</text><text x="40" y="519" font-size="15" fill="#5D6B70" font-weight="400">documented 2025 dashboard denominator, not average annual headcount.</text><line x1="40" y1="552" x2="920" y2="552" stroke="#D8E1E1"/><text x="40" y="581" font-size="13" fill="#5D6B70" font-weight="400">Source: Own elaboration based on the simulated data and analyses developed for the NovaData Insights academic project.</text></g></svg>
