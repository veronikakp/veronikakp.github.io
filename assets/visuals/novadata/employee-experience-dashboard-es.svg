<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" lang="es" role="img" aria-labelledby="title description"><title id="title">Employee Experience · 2025</title><desc id="description">Medias simuladas de 2025: engagement 2,71 de 5, clima 2,82 de 5, 46,62 horas semanales y brecha salarial −14% frente al mercado. Dimensiones de clima en escala 1–5: carrera 2,7, crecimiento 2,63, equidad salarial 2,56, carga manejable 2,46 y plazos razonables 2,46.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="760" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Employee Experience · 2025</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Proyecto académico en equipo · Datos de RR. HH. simulados</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><rect x="40" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="56" y="212" font-size="31" fill="#173845" font-weight="600">2,71</text><text x="56" y="242" font-size="16" fill="#15262D" font-weight="400">Engagement</text><text x="200" y="212" font-size="16" fill="#15262D" font-weight="400">/ 5</text><rect x="265" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="281" y="212" font-size="31" fill="#173845" font-weight="600">2,82</text><text x="281" y="242" font-size="16" fill="#15262D" font-weight="400">Clima</text><text x="425" y="212" font-size="16" fill="#15262D" font-weight="400">/ 5</text><rect x="490" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="506" y="212" font-size="31" fill="#173845" font-weight="600">46,62</text><text x="506" y="242" font-size="16" fill="#15262D" font-weight="400">Horas semanales</text><text x="650" y="212" font-size="16" fill="#15262D" font-weight="400"></text><rect x="715" y="169" width="210" height="100" rx="6" fill="#F0F4F3"/><text x="731" y="212" font-size="31" fill="#173845" font-weight="600">−14%</text><text x="731" y="242" font-size="16" fill="#15262D" font-weight="400">Brecha salarial</text><text x="875" y="212" font-size="16" fill="#15262D" font-weight="400"></text><text x="40" y="315" font-size="20" fill="#173845" font-weight="600">Dimensiones de clima · media, escala 1–5</text><text x="40" y="358" font-size="18" fill="#15262D" font-weight="400">Trayectoria profesional</text><rect x="330" y="343" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="343" width="259.20000000000005" height="12" rx="0" fill="#2B6F83"/><text x="839" y="358" font-size="18" fill="#15262D" font-weight="400">2,7 / 5</text><text x="40" y="406" font-size="18" fill="#15262D" font-weight="400">Crecimiento profesional</text><rect x="330" y="391" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="391" width="252.48000000000002" height="12" rx="0" fill="#2B6F83"/><text x="839" y="406" font-size="18" fill="#15262D" font-weight="400">2,63 / 5</text><text x="40" y="454" font-size="18" fill="#15262D" font-weight="400">Equidad salarial</text><rect x="330" y="439" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="439" width="245.76" height="12" rx="0" fill="#2B6F83"/><text x="839" y="454" font-size="18" fill="#15262D" font-weight="400">2,56 / 5</text><text x="40" y="502" font-size="18" fill="#15262D" font-weight="400">Carga manejable</text><rect x="330" y="487" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="487" width="236.16" height="12" rx="0" fill="#2B6F83"/><text x="839" y="502" font-size="18" fill="#15262D" font-weight="400">2,46 / 5</text><text x="40" y="550" font-size="18" fill="#15262D" font-weight="400">Plazos razonables</text><rect x="330" y="535" width="480" height="12" rx="0" fill="#F0F4F3"/><rect x="330" y="535" width="236.16" height="12" rx="0" fill="#2B6F83"/><text x="839" y="550" font-size="18" fill="#15262D" font-weight="400">2,46 / 5</text><text x="40" y="601" font-size="14" fill="#5D6B70" font-weight="400">Barras desde cero; escala del instrumento 1–5.</text><text x="40" y="635" font-size="15" fill="#5D6B70" font-weight="400">El panel conserva la unidad de cada medida. Las dimensiones de clima son medias descriptivas; no</text><text x="40" y="659" font-size="15" fill="#5D6B70" font-weight="400">explican las causas de las salidas.</text><line x1="40" y1="672" x2="920" y2="672" stroke="#D8E1E1"/><text x="40" y="701" font-size="13" fill="#5D6B70" font-weight="400">Fuente: informe final NovaData Insights, §3.3, PDF pp. 18–20; dashboard y fila total de la matriz.</text></g></svg>
