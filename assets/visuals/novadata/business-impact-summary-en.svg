<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" lang="en" role="img" aria-labelledby="title description"><title id="title">Turnover cost · a scenario estimate</title><desc id="description">Scenario-based simulated turnover cost for 2017–2024: total €2.58 million, unwanted exits €2.30 million and avoidable exits €2.08 million. Unwanted exits account for 89.2% of total estimated cost. Components are recruitment, vacancy, ramp-up productivity loss and onboarding. Categories overlap and must not be summed. These are not observed accounting costs.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="690" rx="0" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">NOVADATA INSIGHTS</text><text x="40" y="85" font-size="28" fill="#173845" font-weight="600">Turnover cost · a scenario estimate</text><text x="40" y="118" font-size="16" fill="#5D6B70" font-weight="400">Academic team project · Simulated HR data</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="220" font-size="56" fill="#173845" font-weight="600">€2.58M</text><text x="410" y="199" font-size="20" fill="#15262D" font-weight="400">Total estimated turnover cost</text><text x="40" y="292" font-size="25" fill="#173845" font-weight="600">€2.30M · unwanted exits</text><text x="490" y="292" font-size="25" fill="#173845" font-weight="600">€2.08M · avoidable exits</text><text x="40" y="342" font-size="16" fill="#5D6B70" font-weight="400">89.2% associated with unwanted exits. Categories overlap; do not sum them.</text><rect x="40" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="54" y="445" font-size="18" fill="#15262D" font-weight="400">Recruitment</text><rect x="265" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="279" y="445" font-size="18" fill="#15262D" font-weight="400">Vacancy</text><rect x="490" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="504" y="445" font-size="18" fill="#15262D" font-weight="400">Ramp-up loss</text><rect x="715" y="400" width="210" height="76" rx="6" fill="#F0F4F3"/><text x="729" y="445" font-size="18" fill="#15262D" font-weight="400">Onboarding</text><text x="40" y="529" font-size="15" fill="#5D6B70" font-weight="400">Estimates under documented assumptions, not observed accounting expenditure, savings or</text><text x="40" y="553" font-size="15" fill="#5D6B70" font-weight="400">intervention ROI. The period is 2017–2024.</text><line x1="40" y1="602" x2="920" y2="602" stroke="#D8E1E1"/><text x="40" y="631" font-size="13" fill="#5D6B70" font-weight="400">Source: Own elaboration based on the simulated data and analyses developed for the NovaData Insights academic project.</text></g></svg>
