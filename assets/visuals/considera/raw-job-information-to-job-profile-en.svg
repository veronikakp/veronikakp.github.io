<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" lang="en" role="img" aria-labelledby="title description"><title id="title">Raw information → a structured role profile</title><desc id="description">Illustrative reconstruction · No client data shown. Fictional Project Coordinator. Three invented inputs about request lists, hand-offs and timeline updates become a structured mission and responsibilities, with Service Specialist and Team Supervisor collaboration, knowledge requirements, illustrative review indicators and generic competencies. Review questions validate the profile, not an employee’s performance.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#28746F"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1100" rx="6" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">CONSIDERA</text><text x="40" y="84" font-size="28" fill="#173845" font-weight="600">Raw information → a structured role profile</text><text x="40" y="118" font-size="16" fill="#173845" font-weight="600">Illustrative reconstruction · No client data shown</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="180" font-size="22" fill="#173845" font-weight="600">Project Coordinator</text><rect x="40" y="208" width="400" height="510" rx="6" fill="#F0F4F3"/><rect x="480" y="208" width="440" height="670" rx="6" fill="#E9F1F3"/><path d="M445 460 L474 460" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><text x="58" y="244" font-size="20" fill="#173845" font-weight="600">Synthetic input</text><text x="58" y="280" font-size="16" fill="#15262D" font-weight="400">“I bring the request list and</text><text x="58" y="304" font-size="16" fill="#15262D" font-weight="400">pending actions together before the</text><text x="58" y="328" font-size="16" fill="#15262D" font-weight="400">project check-in.”</text><text x="58" y="378" font-size="16" fill="#15262D" font-weight="400">“When a hand-off is unclear, I ask</text><text x="58" y="402" font-size="16" fill="#15262D" font-weight="400">the relevant role to agree who takes</text><text x="58" y="426" font-size="16" fill="#15262D" font-weight="400">the next step.”</text><text x="58" y="476" font-size="16" fill="#15262D" font-weight="400">“I update the timeline when</text><text x="58" y="500" font-size="16" fill="#15262D" font-weight="400">priorities change and flag</text><text x="58" y="524" font-size="16" fill="#15262D" font-weight="400">dependencies for review.”</text><text x="498" y="244" font-size="20" fill="#173845" font-weight="600">Structured profile</text><text x="498" y="278" font-size="16" fill="#15262D" font-weight="400">Mission: Keep project work coordinated by</text><text x="498" y="302" font-size="16" fill="#15262D" font-weight="400">making commitments, dependencies and</text><text x="498" y="326" font-size="16" fill="#15262D" font-weight="400">hand-offs explicit.</text><text x="498" y="370" font-size="16" fill="#15262D" font-weight="400">• Consolidate requests, owners and due</text><text x="498" y="394" font-size="16" fill="#15262D" font-weight="400">dates in one project view.</text><text x="498" y="432" font-size="16" fill="#15262D" font-weight="400">• Clarify hand-offs and bring unresolved</text><text x="498" y="456" font-size="16" fill="#15262D" font-weight="400">dependencies to review.</text><text x="498" y="494" font-size="16" fill="#15262D" font-weight="400">• Keep commitments current when the</text><text x="498" y="518" font-size="16" fill="#15262D" font-weight="400">agreed priorities change.</text><text x="498" y="556" font-size="15" fill="#5D6B70" font-weight="400">Interfaces: Service Specialist · Team</text><text x="498" y="580" font-size="15" fill="#5D6B70" font-weight="400">Supervisor</text><text x="498" y="618" font-size="15" fill="#5D6B70" font-weight="400">Working knowledge of project records,</text><text x="498" y="642" font-size="15" fill="#5D6B70" font-weight="400">scheduling and clear written updates.</text><text x="498" y="680" font-size="15" fill="#5D6B70" font-weight="400">Each action has an owner and an agreed</text><text x="498" y="704" font-size="15" fill="#5D6B70" font-weight="400">due date; unresolved dependencies are</text><text x="498" y="728" font-size="15" fill="#5D6B70" font-weight="400">visible at review.</text><text x="498" y="766" font-size="15" fill="#5D6B70" font-weight="400">Clear Communication · Planning &amp;</text><text x="498" y="790" font-size="15" fill="#5D6B70" font-weight="400">Prioritisation · Problem Solving</text><text x="40" y="930" font-size="15" fill="#5D6B70" font-weight="400">Illustrative validation questions: Are responsibilities clear? Who confirms a hand-off? Which</text><text x="40" y="954" font-size="15" fill="#5D6B70" font-weight="400">dependencies require escalation?</text><line x1="40" y1="1004" x2="920" y2="1004" stroke="#D8E1E1"/><text x="40" y="1032" font-size="13" fill="#5D6B70" font-weight="400">Source: newly authored synthetic input and profile; consolidation and validation structure</text><text x="40" y="1052" font-size="13" fill="#5D6B70" font-weight="400">based on the consulting methodology.</text></g></svg>
