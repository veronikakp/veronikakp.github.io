<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" lang="en" role="img" aria-labelledby="title description"><title id="title">From role requirements to development design</title><desc id="description">Illustrative reconstruction · No client data shown. Academic proposal, not implemented. Team Supervisor / People Leadership: current role remit focuses on allocation, hand-offs and escalation; the strategic remit adds feedback, coaching and follow-up. A role-level development need leads to behavioural objectives, simulated practice and proposed evaluation of reaction, learning, transfer and outcomes. No employees are scored and no post-intervention result is claimed.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#28746F"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1120" rx="6" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">CONSIDERA</text><text x="40" y="84" font-size="28" fill="#173845" font-weight="600">From role requirements to development design</text><text x="40" y="118" font-size="16" fill="#173845" font-weight="600">Illustrative reconstruction · No client data shown</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="182" font-size="18" fill="#173845" font-weight="600">Academic extension · Proposal only · Not implemented</text><text x="40" y="220" font-size="21" fill="#173845" font-weight="600">Team Supervisor / People Leadership</text><rect x="40" y="250" width="430" height="174" rx="6" fill="#F0F4F3"/><text x="58" y="286" font-size="19" fill="#173845" font-weight="600">Current role remit</text><text x="58" y="320" font-size="16" fill="#15262D" font-weight="400">The role allocates work, clarifies hand-</text><text x="58" y="344" font-size="16" fill="#15262D" font-weight="400">offs and escalates unresolved coordination</text><text x="58" y="368" font-size="16" fill="#15262D" font-weight="400">issues.</text><rect x="490" y="250" width="430" height="174" rx="6" fill="#F0F4F3"/><text x="508" y="286" font-size="19" fill="#173845" font-weight="600">Strategic role remit</text><text x="508" y="320" font-size="16" fill="#15262D" font-weight="400">The role also supports development through</text><text x="508" y="344" font-size="16" fill="#15262D" font-weight="400">clear feedback, coaching conversations and</text><text x="508" y="368" font-size="16" fill="#15262D" font-weight="400">agreed follow-up.</text><path d="M480 295 L486 295" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="464" font-size="17" fill="#173845" font-weight="400">Make development responsibilities explicit in the role design; define the behaviours and</text><text x="40" y="488" font-size="17" fill="#173845" font-weight="400">opportunities to practise them.</text><rect x="40" y="528" width="880" height="246" rx="6" fill="#E9F1F3"/><text x="58" y="567" font-size="21" fill="#173845" font-weight="600">Behavioural objectives &amp; practice</text><text x="58" y="609" font-size="16" fill="#15262D" font-weight="400">• Agree a specific next step during a structured feedback conversation.</text><text x="58" y="643" font-size="16" fill="#15262D" font-weight="400">• Use open questions to support a colleague’s reflection on a fictional coordination problem.</text><text x="58" y="677" font-size="16" fill="#15262D" font-weight="400">• Rehearse a feedback conversation using a fictional hand-off scenario.</text><text x="58" y="711" font-size="16" fill="#15262D" font-weight="400">• Design a follow-up routine tied to the role’s responsibilities.</text><text x="40" y="816" font-size="21" fill="#173845" font-weight="600">Proposed evaluation · no results claimed</text><rect x="40" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="54" y="875" font-size="17" fill="#173845" font-weight="600">Reaction</text><rect x="265" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="279" y="875" font-size="17" fill="#173845" font-weight="600">Learning</text><rect x="490" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="504" y="875" font-size="17" fill="#173845" font-weight="600">Transfer</text><rect x="715" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="729" y="875" font-size="17" fill="#173845" font-weight="600">Outcomes</text><text x="40" y="946" font-size="16" fill="#5D6B70" font-weight="400">Role requirements, not individual skill deficits. Proposal only; no measured impact.</text><line x1="40" y1="1024" x2="920" y2="1024" stroke="#D8E1E1"/><text x="40" y="1052" font-size="13" fill="#5D6B70" font-weight="400">Source: newly authored fictional scenario and activities; methodological structure from the</text><text x="40" y="1072" font-size="13" fill="#5D6B70" font-weight="400">academic extension. No client gaps or outcomes are used.</text></g></svg>
