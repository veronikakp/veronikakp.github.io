<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" lang="es" role="img" aria-labelledby="title description"><title id="title">Información inicial → perfil estructurado</title><desc id="description">Reconstrucción ilustrativa · No se muestran datos del cliente. Puesto ficticio de Coordinador/a de proyectos. Tres aportaciones iniciales inventadas sobre solicitudes, traspasos y calendario se consolidan en misión y responsabilidades, colaboraciones con Especialista de servicios y Supervisor/a de equipo, conocimientos, indicadores ilustrativos de revisión y competencias genéricas. Las preguntas revisan el perfil, no el desempeño de una persona.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#28746F"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1100" rx="6" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">CONSIDERA</text><text x="40" y="84" font-size="28" fill="#173845" font-weight="600">Información inicial → perfil estructurado</text><text x="40" y="118" font-size="16" fill="#173845" font-weight="600">Reconstrucción ilustrativa · No se muestran datos del cliente</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="180" font-size="22" fill="#173845" font-weight="600">Coordinador/a de proyectos</text><rect x="40" y="208" width="400" height="510" rx="6" fill="#F0F4F3"/><rect x="480" y="208" width="440" height="670" rx="6" fill="#E9F1F3"/><path d="M445 460 L474 460" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><text x="58" y="244" font-size="20" fill="#173845" font-weight="600">Aportaciones iniciales sintéticas</text><text x="58" y="280" font-size="16" fill="#15262D" font-weight="400">“Reúno la lista de solicitudes y las</text><text x="58" y="304" font-size="16" fill="#15262D" font-weight="400">acciones pendientes antes de la</text><text x="58" y="328" font-size="16" fill="#15262D" font-weight="400">reunión de seguimiento.”</text><text x="58" y="378" font-size="16" fill="#15262D" font-weight="400">“Si un traspaso no está claro, pido</text><text x="58" y="402" font-size="16" fill="#15262D" font-weight="400">al puesto implicado que acuerde quién</text><text x="58" y="426" font-size="16" fill="#15262D" font-weight="400">da el siguiente paso.”</text><text x="58" y="476" font-size="16" fill="#15262D" font-weight="400">“Actualizo el calendario si cambian</text><text x="58" y="500" font-size="16" fill="#15262D" font-weight="400">las prioridades y señalo las</text><text x="58" y="524" font-size="16" fill="#15262D" font-weight="400">dependencias que hay que revisar.”</text><text x="498" y="244" font-size="20" fill="#173845" font-weight="600">Perfil estructurado</text><text x="498" y="278" font-size="16" fill="#15262D" font-weight="400">Misión: Mantener coordinado el trabajo</text><text x="498" y="302" font-size="16" fill="#15262D" font-weight="400">del proyecto haciendo explícitos los</text><text x="498" y="326" font-size="16" fill="#15262D" font-weight="400">compromisos, las dependencias y los</text><text x="498" y="350" font-size="16" fill="#15262D" font-weight="400">traspasos.</text><text x="498" y="394" font-size="16" fill="#15262D" font-weight="400">• Consolidar solicitudes, responsables y</text><text x="498" y="418" font-size="16" fill="#15262D" font-weight="400">plazos en una visión común del proyecto.</text><text x="498" y="456" font-size="16" fill="#15262D" font-weight="400">• Aclarar los traspasos y llevar a</text><text x="498" y="480" font-size="16" fill="#15262D" font-weight="400">revisión las dependencias pendientes.</text><text x="498" y="518" font-size="16" fill="#15262D" font-weight="400">• Actualizar los compromisos cuando</text><text x="498" y="542" font-size="16" fill="#15262D" font-weight="400">cambien las prioridades acordadas.</text><text x="498" y="580" font-size="15" fill="#5D6B70" font-weight="400">Colaboraciones: Especialista de servicios</text><text x="498" y="604" font-size="15" fill="#5D6B70" font-weight="400">· Supervisor/a de equipo</text><text x="498" y="642" font-size="15" fill="#5D6B70" font-weight="400">Conocimientos de documentación de</text><text x="498" y="666" font-size="15" fill="#5D6B70" font-weight="400">proyectos, planificación temporal y</text><text x="498" y="690" font-size="15" fill="#5D6B70" font-weight="400">comunicación escrita clara.</text><text x="498" y="728" font-size="15" fill="#5D6B70" font-weight="400">Cada acción tiene responsable y plazo</text><text x="498" y="752" font-size="15" fill="#5D6B70" font-weight="400">acordado; las dependencias pendientes</text><text x="498" y="776" font-size="15" fill="#5D6B70" font-weight="400">están visibles en la revisión.</text><text x="498" y="814" font-size="15" fill="#5D6B70" font-weight="400">Comunicación clara · Planificación y</text><text x="498" y="838" font-size="15" fill="#5D6B70" font-weight="400">priorización · Resolución de problemas</text><text x="40" y="930" font-size="15" fill="#5D6B70" font-weight="400">Preguntas ilustrativas de validación: ¿Están claras las responsabilidades? ¿Quién confirma un</text><text x="40" y="954" font-size="15" fill="#5D6B70" font-weight="400">traspaso? ¿Qué dependencias requieren escalado?</text><line x1="40" y1="1004" x2="920" y2="1004" stroke="#D8E1E1"/><text x="40" y="1032" font-size="13" fill="#5D6B70" font-weight="400">Fuente: información de entrada y perfil sintéticos redactados desde cero; estructura de consolidación y</text><text x="40" y="1052" font-size="13" fill="#5D6B70" font-weight="400">validación basada en la metodología de consultoría.</text></g></svg>
