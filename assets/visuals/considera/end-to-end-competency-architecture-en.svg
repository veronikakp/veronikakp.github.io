<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" lang="en" role="img" aria-labelledby="title description"><title id="title">A connected competency architecture</title><desc id="description">Illustrative reconstruction · No client data shown. Professional architecture: context and work information; role consolidation; profiles and validation; dictionary and indicators; role relevance; competency–role mapping. These elements are reviewed iteratively. The academic extension is outside this professional flow.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#28746F"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="940" rx="6" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">CONSIDERA</text><text x="40" y="84" font-size="28" fill="#173845" font-weight="600">A connected competency architecture</text><text x="40" y="118" font-size="16" fill="#173845" font-weight="600">Illustrative reconstruction · No client data shown</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="178" font-size="18" fill="#173845" font-weight="600">Professional consulting work</text><rect x="40" y="206" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="56" y="235" font-size="14" fill="#28746F" font-weight="600">01</text><text x="56" y="266" font-size="18" fill="#173845" font-weight="600">Context &amp; work</text><text x="56" y="290" font-size="18" fill="#173845" font-weight="600">information</text><text x="56" y="322" font-size="14" fill="#5D6B70" font-weight="400">Establish the work to be</text><text x="56" y="342" font-size="14" fill="#5D6B70" font-weight="400">understood and gather role-</text><text x="56" y="362" font-size="14" fill="#5D6B70" font-weight="400">related input.</text><path d="M322 286 L336 286" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="206" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="356" y="235" font-size="14" fill="#28746F" font-weight="600">02</text><text x="356" y="266" font-size="18" fill="#173845" font-weight="600">Role consolidation</text><text x="356" y="298" font-size="14" fill="#5D6B70" font-weight="400">Group tasks, responsibilities</text><text x="356" y="318" font-size="14" fill="#5D6B70" font-weight="400">and dependencies into a</text><text x="356" y="338" font-size="14" fill="#5D6B70" font-weight="400">coherent draft.</text><path d="M622 286 L636 286" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="206" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="656" y="235" font-size="14" fill="#28746F" font-weight="600">03</text><text x="656" y="266" font-size="18" fill="#173845" font-weight="600">Profiles &amp; validation</text><text x="656" y="298" font-size="14" fill="#5D6B70" font-weight="400">Review the draft with role</text><text x="656" y="318" font-size="14" fill="#5D6B70" font-weight="400">holders and supervision;</text><text x="656" y="338" font-size="14" fill="#5D6B70" font-weight="400">resolve unclear</text><text x="656" y="358" font-size="14" fill="#5D6B70" font-weight="400">responsibilities.</text><rect x="40" y="452" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="56" y="481" font-size="14" fill="#28746F" font-weight="600">04</text><text x="56" y="512" font-size="18" fill="#173845" font-weight="600">Dictionary &amp;</text><text x="56" y="536" font-size="18" fill="#173845" font-weight="600">indicators</text><text x="56" y="568" font-size="14" fill="#5D6B70" font-weight="400">Define shared behavioural</text><text x="56" y="588" font-size="14" fill="#5D6B70" font-weight="400">language and observable</text><text x="56" y="608" font-size="14" fill="#5D6B70" font-weight="400">indicators.</text><path d="M322 532 L336 532" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="452" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="356" y="481" font-size="14" fill="#28746F" font-weight="600">05</text><text x="356" y="512" font-size="18" fill="#173845" font-weight="600">Role relevance</text><text x="356" y="544" font-size="14" fill="#5D6B70" font-weight="400">Consider which behaviours</text><text x="356" y="564" font-size="14" fill="#5D6B70" font-weight="400">matter for each fictional role.</text><path d="M622 532 L636 532" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="452" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="656" y="481" font-size="14" fill="#28746F" font-weight="600">06</text><text x="656" y="512" font-size="18" fill="#173845" font-weight="600">Competency–role</text><text x="656" y="536" font-size="18" fill="#173845" font-weight="600">mapping</text><text x="656" y="568" font-size="14" fill="#5D6B70" font-weight="400">Connect the profiles and</text><text x="656" y="588" font-size="14" fill="#5D6B70" font-weight="400">competency requirements in one</text><text x="656" y="608" font-size="14" fill="#5D6B70" font-weight="400">reviewed structure.</text><path d="M780 418 L780 434 L180 434 L180 448" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="740" font-size="15" fill="#5D6B70" font-weight="400">Review loop: profiles, dictionary and relevance inform one another. Mapping can send a draft</text><text x="40" y="764" font-size="15" fill="#5D6B70" font-weight="400">back for clarification.</text><line x1="40" y1="844" x2="920" y2="844" stroke="#D8E1E1"/><text x="40" y="872" font-size="13" fill="#5D6B70" font-weight="400">Source: Own illustrative reconstruction based on the consulting methodology. No client data or original client artefacts are shown.</text></g></svg>
