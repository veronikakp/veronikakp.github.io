<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880" lang="es" role="img" aria-labelledby="title description"><title id="title">Relevancia del puesto · matriz sintética</title><desc id="description">Reconstrucción ilustrativa · No se muestran datos del cliente. 1 = No relevante · 5 = Esencial. Relevancia para el puesto, no nivel de dominio de empleados. Todos los valores son sintéticos. Columnas, en orden: Colaboración, Comunicación clara, Planificación y priorización, Adaptabilidad, Resolución de problemas, Liderazgo de personas. Técnico/a de apoyo administrativo: 4, 4, 4, 3, 3, 1; Especialista de servicios: 5, 5, 3, 5, 4, 2; Coordinador/a de proyectos: 4, 5, 5, 4, 5, 3; Supervisor/a de equipo: 5, 4, 4, 4, 4, 5; Responsable de unidad: 4, 5, 5, 4, 5, 5.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#28746F"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1320" height="880" rx="6" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">CONSIDERA</text><text x="40" y="84" font-size="28" fill="#173845" font-weight="600">Relevancia del puesto · matriz sintética</text><text x="40" y="118" font-size="16" fill="#173845" font-weight="600">Reconstrucción ilustrativa · No se muestran datos del cliente</text><line x1="40" y1="142" x2="1280" y2="142" stroke="#D8E1E1"/><text x="40" y="180" font-size="18" fill="#173845" font-weight="600">1 = No relevante · 5 = Esencial</text><text x="40" y="218" font-size="17" fill="#173845" font-weight="400">Relevancia para el puesto, no nivel de dominio de empleados. Todos los valores son sintéticos.</text><rect x="40" y="260" width="1240" height="112" rx="0" fill="#F0F4F3"/><text x="54" y="300" font-size="16" fill="#173845" font-weight="600">Puesto ficticio</text><text x="350" y="300" font-size="16" fill="#173845" font-weight="600">Colaboración</text><text 