<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" lang="es" role="img" aria-labelledby="title description"><title id="title">Una arquitectura de competencias conectada</title><desc id="description">Reconstrucción ilustrativa · No se muestran datos del cliente. Arquitectura profesional: contexto e información del trabajo; consolidación por puesto; perfiles y validación; diccionario e indicadores; relevancia del puesto; matriz competencia–puesto. Los elementos se revisan de forma iterativa. La ampliación académica queda fuera de este flujo profesional.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#28746F"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="940" rx="6" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">CONSIDERA</text><text x="40" y="84" font-size="28" fill="#173845" font-weight="600">Una arquitectura de competencias conectada</text><text x="40" y="118" font-size="16" fill="#173845" font-weight="600">Reconstrucción ilustrativa · No se muestran datos del cliente</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="178" font-size="18" fill="#173845" font-weight="600">Trabajo profesional de consultoría</text><rect x="40" y="206" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="56" y="235" font-size="14" fill="#28746F" font-weight="600">01</text><text x="56" y="266" font-size="18" fill="#173845" font-weight="600">Contexto e información</text><text x="56" y="290" font-size="18" fill="#173845" font-weight="600">del trabajo</text><text x="56" y="322" font-size="14" fill="#5D6B70" font-weight="400">Delimitar el trabajo que se</text><text x="56" y="342" font-size="14" fill="#5D6B70" font-weight="400">quiere comprender y reunir</text><text x="56" y="362" font-size="14" fill="#5D6B70" font-weight="400">información por puesto.</text><path d="M322 286 L336 286" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="206" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="356" y="235" font-size="14" fill="#28746F" font-weight="600">02</text><text x="356" y="266" font-size="18" fill="#173845" font-weight="600">Consolidación por puesto</text><text x="356" y="298" font-size="14" fill="#5D6B70" font-weight="400">Agrupar tareas,</text><text x="356" y="318" font-size="14" fill="#5D6B70" font-weight="400">responsabilidades y</text><text x="356" y="338" font-size="14" fill="#5D6B70" font-weight="400">dependencias en un borrador</text><text x="356" y="358" font-size="14" fill="#5D6B70" font-weight="400">coherente.</text><path d="M622 286 L636 286" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="206" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="656" y="235" font-size="14" fill="#28746F" font-weight="600">03</text><text x="656" y="266" font-size="18" fill="#173845" font-weight="600">Perfiles y validación</text><text x="656" y="298" font-size="14" fill="#5D6B70" font-weight="400">Revisar el borrador con</text><text x="656" y="318" font-size="14" fill="#5D6B70" font-weight="400">ocupantes y supervisión;</text><text x="656" y="338" font-size="14" fill="#5D6B70" font-weight="400">aclarar responsabilidades.</text><rect x="40" y="452" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="56" y="481" font-size="14" fill="#28746F" font-weight="600">04</text><text x="56" y="512" font-size="18" fill="#173845" font-weight="600">Diccionario e</text><text x="56" y="536" font-size="18" fill="#173845" font-weight="600">indicadores</text><text x="56" y="568" font-size="14" fill="#5D6B70" font-weight="400">Definir un lenguaje conductual</text><text x="56" y="588" font-size="14" fill="#5D6B70" font-weight="400">común e indicadores</text><text x="56" y="608" font-size="14" fill="#5D6B70" font-weight="400">observables.</text><path d="M322 532 L336 532" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="452" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="356" y="481" font-size="14" fill="#28746F" font-weight="600">05</text><text x="356" y="512" font-size="18" fill="#173845" font-weight="600">Relevancia para el puesto</text><text x="356" y="544" font-size="14" fill="#5D6B70" font-weight="400">Valorar qué conductas son</text><text x="356" y="564" font-size="14" fill="#5D6B70" font-weight="400">relevantes para cada puesto</text><text x="356" y="584" font-size="14" fill="#5D6B70" font-weight="400">ficticio.</text><path d="M622 532 L636 532" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="452" width="280" height="210" rx="6" fill="#F0F4F3"/><text x="656" y="481" font-size="14" fill="#28746F" font-weight="600">06</text><text x="656" y="512" font-size="18" fill="#173845" font-weight="600">Matriz competencia–puesto</text><text x="656" y="544" font-size="14" fill="#5D6B70" font-weight="400">Conectar perfiles y requisitos</text><text x="656" y="564" font-size="14" fill="#5D6B70" font-weight="400">competenciales en una</text><text x="656" y="584" font-size="14" fill="#5D6B70" font-weight="400">estructura revisada.</text><path d="M780 418 L780 434 L180 434 L180 448" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="740" font-size="15" fill="#5D6B70" font-weight="400">Revisión iterativa: perfiles, diccionario y relevancia se informan mutuamente. La matriz puede</text><text x="40" y="764" font-size="15" fill="#5D6B70" font-weight="400">devolver un borrador a revisión.</text><line x1="40" y1="844" x2="920" y2="844" stroke="#D8E1E1"/><text x="40" y="872" font-size="13" fill="#5D6B70" font-weight="400">Fuente: Reconstrucción ilustrativa de elaboración propia basada en la metodología de consultoría. No se muestran datos ni artefactos originales del cliente.</text></g></svg>
