<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" lang="es" role="img" aria-labelledby="title description"><title id="title">De requisitos del puesto a diseño de desarrollo</title><desc id="description">Reconstrucción ilustrativa · No se muestran datos del cliente. Propuesta académica no implementada. Supervisor/a de equipo / Liderazgo de personas: las responsabilidades actuales se centran en distribución, traspasos y escalado; las estratégicas añaden feedback, acompañamiento y seguimiento. Una necesidad de desarrollo del puesto conduce a objetivos conductuales, práctica simulada y evaluación propuesta de reacción, aprendizaje, transferencia y resultados. No se puntúa a empleados ni se atribuyen resultados posteriores.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#28746F"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="960" height="1120" rx="6" fill="#FFFFFF"/><text x="40" y="42" font-size="14" fill="#5D6B70" font-weight="600">CONSIDERA</text><text x="40" y="84" font-size="28" fill="#173845" font-weight="600">De requisitos del puesto a diseño de desarrollo</text><text x="40" y="118" font-size="16" fill="#173845" font-weight="600">Reconstrucción ilustrativa · No se muestran datos del cliente</text><line x1="40" y1="142" x2="920" y2="142" stroke="#D8E1E1"/><text x="40" y="182" font-size="18" fill="#173845" font-weight="600">Ampliación académica · Solo propuesta · No implementada</text><text x="40" y="220" font-size="21" fill="#173845" font-weight="600">Supervisor/a de equipo / Liderazgo de personas</text><rect x="40" y="250" width="430" height="174" rx="6" fill="#F0F4F3"/><text x="58" y="286" font-size="19" fill="#173845" font-weight="600">Responsabilidades actuales</text><text x="58" y="320" font-size="16" fill="#15262D" font-weight="400">El puesto distribuye trabajo, aclara</text><text x="58" y="344" font-size="16" fill="#15262D" font-weight="400">traspasos y escala problemas de</text><text x="58" y="368" font-size="16" fill="#15262D" font-weight="400">coordinación pendientes.</text><rect x="490" y="250" width="430" height="174" rx="6" fill="#F0F4F3"/><text x="508" y="286" font-size="19" fill="#173845" font-weight="600">Responsabilidades estratégicas</text><text x="508" y="320" font-size="16" fill="#15262D" font-weight="400">El puesto también apoya el desarrollo</text><text x="508" y="344" font-size="16" fill="#15262D" font-weight="400">mediante feedback claro, conversaciones de</text><text x="508" y="368" font-size="16" fill="#15262D" font-weight="400">acompañamiento y seguimiento acordado.</text><path d="M480 295 L486 295" fill="none" stroke="#28746F" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="464" font-size="17" fill="#173845" font-weight="400">Hacer explícitas las responsabilidades de desarrollo en el diseño del puesto; definir conductas y</text><text x="40" y="488" font-size="17" fill="#173845" font-weight="400">oportunidades para practicarlas.</text><rect x="40" y="528" width="880" height="246" rx="6" fill="#E9F1F3"/><text x="58" y="567" font-size="21" fill="#173845" font-weight="600">Objetivos conductuales y práctica</text><text x="58" y="609" font-size="16" fill="#15262D" font-weight="400">• Acordar un siguiente paso concreto en una conversación estructurada de feedback.</text><text x="58" y="643" font-size="16" fill="#15262D" font-weight="400">• Usar preguntas abiertas para apoyar la reflexión sobre un problema ficticio de coordinación.</text><text x="58" y="677" font-size="16" fill="#15262D" font-weight="400">• Ensayar una conversación de feedback con un escenario ficticio de traspaso.</text><text x="58" y="711" font-size="16" fill="#15262D" font-weight="400">• Diseñar una rutina de seguimiento vinculada a las responsabilidades del puesto.</text><text x="40" y="816" font-size="21" fill="#173845" font-weight="600">Evaluación propuesta · sin resultados atribuidos</text><rect x="40" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="54" y="875" font-size="17" fill="#173845" font-weight="600">Reacción</text><rect x="265" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="279" y="875" font-size="17" fill="#173845" font-weight="600">Aprendizaje</text><rect x="490" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="504" y="875" font-size="17" fill="#173845" font-weight="600">Transferencia</text><rect x="715" y="844" width="210" height="50" rx="6" fill="#F0F4F3"/><text x="729" y="875" font-size="17" fill="#173845" font-weight="600">Resultados</text><text x="40" y="946" font-size="16" fill="#5D6B70" font-weight="400">Requisitos del puesto, no déficits individuales. Solo propuesta; sin impacto medido.</text><line x1="40" y1="1024" x2="920" y2="1024" stroke="#D8E1E1"/><text x="40" y="1052" font-size="13" fill="#5D6B70" font-weight="400">Fuente: Reconstrucción ilustrativa de elaboración propia basada en la ampliación académica. No se muestran datos del cliente ni resultados medidos.</text></g></svg>
